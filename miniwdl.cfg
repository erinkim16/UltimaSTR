[scheduler]
container_backend = singularity

[singularity]
exe = ["apptainer"]
run_options = ["--containall", "--no-mount", "hostfs"]
image_cache = "/scratch/seokim/UltimaSTR/containers"

[file_io]
allow_any_input = true
output_hardlinks = true
delete_work = success

[call_cache]
put = true
get = true
backend = dir
dir = "/scratch/seokim/UltimaSTR/wdl_cache"
